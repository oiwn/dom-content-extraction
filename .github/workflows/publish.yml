name: Publish to crates.io

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.compare_versions.outputs.should_publish }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch all history for comparing versions

    - name: Compare versions
      id: compare_versions
      run: |
        # Get the current version from Cargo.toml
        CURRENT_VERSION=$(grep '^version = ' Cargo.toml | cut -d '"' -f 2)
        echo "Current version: $CURRENT_VERSION"

        # Get the previous version from the last commit
        git checkout HEAD~1
        PREVIOUS_VERSION=$(grep '^version = ' Cargo.toml | cut -d '"' -f 2)
        echo "Previous version: $PREVIOUS_VERSION"

        # Compare versions
        if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
          echo "Version changed from $PREVIOUS_VERSION to $CURRENT_VERSION"
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
        else
          echo "Version unchanged"
          echo "should_publish=false" >> "$GITHUB_OUTPUT"
        fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: stable

    - name: Check if package is publishable
      run: cargo publish --locked --dry-run

    - name: Publish to crates.io
      run: cargo publish --locked --token ${{ secrets.CRATES_IO_TOKEN }}

