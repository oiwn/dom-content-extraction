[package]
name = "dom-content-extraction"
version = "0.4.5"

description = "Rust implementation of Content extraction via text density paper"
license = "MPL-2.0"
documentation = "https://docs.rs/dom-content-extraction/latest/dom_content_extraction/"
homepage = "https://github.com/oiwn/dom-content-extraction"
repository = "https://github.com/oiwn/dom-content-extraction"
readme = "README.md"
keywords = ["dom-text-density"]
categories = ["data-structures", "web-programming", "text-processing"]
exclude = [
    "tmp/*",
    "benches/*",
    "html/*",
    ".github/*",
    ".gitignore",
    ".tmuxp.yaml",
    ".amc.toml",
    "notes.org"
]

edition = "2024"
rust-version = "1.88"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
ego-tree = "0.11.0"
scraper = "0.27.0"
thiserror = "2.0.20"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
htmd = { version = "0.5.5", optional = true }

[dev-dependencies]
chardetng = "1.0.0"
encoding_rs = "0.8.41"
criterion = "0.8.2"
zip = "8.6.0"
anyhow = "1.0.104"
regex = "1.13.1"
rayon = "1.12.0"
strsim = "0.11.1"

[[bench]]
name = "simple"
harness = false

[lib]
doctest = false

[features]
default = []
markdown = ["dep:htmd"]
